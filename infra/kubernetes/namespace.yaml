apiVersion: v1
kind: Namespace
metadata:
  name: sentinelx
  labels:
    app.kubernetes.io/name: sentinelx
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinelx-config
  namespace: sentinelx
data:
  KAFKA_BROKERS: "kafka:9092"
  CLICKHOUSE_HOST: "clickhouse"
  CLICKHOUSE_PORT: "8123"
  CLICKHOUSE_DB: "sentinelx"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  LOG_LEVEL: "INFO"
---
apiVersion: v1
kind: Secret
metadata:
  name: sentinelx-secrets
  namespace: sentinelx
type: Opaque
stringData:
  SUPABASE_URL: "https://your-project.supabase.co"
  SUPABASE_SERVICE_KEY: "your-service-key"
  SUPABASE_JWT_SECRET: "your-jwt-secret"
  REDIS_URL: "redis://redis:6379/0"
  OPENAI_API_KEY: "sk-your-key"
  SLACK_WEBHOOK_URL: ""
