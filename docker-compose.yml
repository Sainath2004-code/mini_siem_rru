version: '3.8'

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-backend-base: &backend-base
  build:
    context: ./backend
  env_file: .env
  depends_on:
    kafka:
      condition: service_healthy
    redis:
      condition: service_healthy
    clickhouse:
      condition: service_healthy
  networks:
    - sentinelx-net
  restart: unless-stopped
  logging: *default-logging

services:
  # ============================================================
  # Infrastructure Layer
  # ============================================================
  zookeeper:
    image: bitnami/zookeeper:3.8
    container_name: sentinelx-zookeeper
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    volumes:
      - zookeeper_data:/bitnami/zookeeper
    networks:
      - sentinelx-net
    logging: *default-logging
    healthcheck:
      test: ["CMD", "zkServer.sh", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: bitnami/kafka:3.4
    container_name: sentinelx-kafka
    ports:
      - "29092:29092"
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,EXTERNAL://:29092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_NUM_PARTITIONS=4
      - KAFKA_CFG_DEFAULT_REPLICATION_FACTOR=1
      - ALLOW_PLAINTEXT_LISTENER=yes
    depends_on:
      - zookeeper
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - sentinelx-net
    logging: *default-logging
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sentinelx-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - sentinelx-net
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: sentinelx-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_DB=sentinelx
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./database/clickhouse/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - sentinelx-net
    logging: *default-logging
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # ============================================================
  # Backend Microservices
  # ============================================================
  api-gateway:
    <<: *backend-base
    container_name: sentinelx-api-gateway
    build:
      context: ./backend
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - SERVICE_NAME=api-gateway

  auth-service:
    <<: *backend-base
    container_name: sentinelx-auth-service
    build:
      context: ./backend
      dockerfile: services/auth-service/Dockerfile
    ports:
      - "8002:8002"
    environment:
      - SERVICE_NAME=auth-service

  ingestion-service:
    <<: *backend-base
    container_name: sentinelx-ingestion
    build:
      context: ./backend
      dockerfile: services/ingestion-service/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - SERVICE_NAME=ingestion-service
    deploy:
      replicas: 2

  parser-service:
    <<: *backend-base
    container_name: sentinelx-parser
    build:
      context: ./backend
      dockerfile: services/parser-service/Dockerfile
    environment:
      - SERVICE_NAME=parser-service
    deploy:
      replicas: 2

  detection-service:
    <<: *backend-base
    container_name: sentinelx-detection
    build:
      context: ./backend
      dockerfile: services/detection-service/Dockerfile
    environment:
      - SERVICE_NAME=detection-service
    deploy:
      replicas: 2

  alert-service:
    <<: *backend-base
    container_name: sentinelx-alerts
    build:
      context: ./backend
      dockerfile: services/alert-service/Dockerfile
    ports:
      - "8004:8004"
    environment:
      - SERVICE_NAME=alert-service

  search-service:
    <<: *backend-base
    container_name: sentinelx-search
    build:
      context: ./backend
      dockerfile: services/search-service/Dockerfile
    ports:
      - "8005:8005"
    environment:
      - SERVICE_NAME=search-service

  websocket-gateway:
    <<: *backend-base
    container_name: sentinelx-ws
    build:
      context: ./backend
      dockerfile: services/websocket-gateway/Dockerfile
    ports:
      - "8006:8006"
    environment:
      - SERVICE_NAME=websocket-gateway

  ai-service:
    <<: *backend-base
    container_name: sentinelx-ai
    build:
      context: ./backend
      dockerfile: services/ai-service/Dockerfile
    ports:
      - "8007:8007"
    environment:
      - SERVICE_NAME=ai-service

  celery-worker:
    <<: *backend-base
    container_name: sentinelx-celery
    build:
      context: ./backend
      dockerfile: services/alert-service/Dockerfile
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=4
    environment:
      - SERVICE_NAME=celery-worker

  # ============================================================
  # Frontend
  # ============================================================
  frontend:
    container_name: sentinelx-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api-gateway:8000
      - NEXT_PUBLIC_WS_URL=ws://websocket-gateway:8006
    depends_on:
      - api-gateway
    networks:
      - sentinelx-net
    logging: *default-logging

  # ============================================================
  # Observability
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: sentinelx-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - sentinelx-net
    logging: *default-logging

  grafana:
    image: grafana/grafana:10.2.0
    container_name: sentinelx-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=sentinelx
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - sentinelx-net
    logging: *default-logging

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: sentinelx-kafka-ui
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=sentinelx
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      - kafka
    networks:
      - sentinelx-net
    logging: *default-logging

volumes:
  zookeeper_data:
  kafka_data:
  redis_data:
  clickhouse_data:
  prometheus_data:
  grafana_data:

networks:
  sentinelx-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
