x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-backend-base: &backend-base
  build:
    context: ./backend
  env_file: .env
  depends_on:
    kafka:
      condition: service_healthy
    redis:
      condition: service_healthy
    clickhouse:
      condition: service_healthy
  networks:
    - sentinelx-net
  restart: unless-stopped
  logging: *default-logging

services:
  # ============================================================
  # Infrastructure Layer
  # ============================================================
  zookeeper:
    image: bitnami/zookeeper:latest
    container_name: sx-zookeeper
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    volumes:
      - sx_zookeeper_data:/bitnami/zookeeper
    networks:
      - sentinelx-net
    logging: *default-logging
    healthcheck:
      test: ["CMD", "zkServer.sh", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: bitnami/kafka:3.4
    container_name: sx-kafka
    ports:
      - "29192:29092"   # External: 29192 (was 29092 — avoids conflict)
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,EXTERNAL://:29092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:29192
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_NUM_PARTITIONS=4
      - KAFKA_CFG_DEFAULT_REPLICATION_FACTOR=1
      - ALLOW_PLAINTEXT_LISTENER=yes
    depends_on:
      - zookeeper
    volumes:
      - sx_kafka_data:/bitnami/kafka
    networks:
      - sentinelx-net
    logging: *default-logging
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sx-redis
    ports:
      - "6479:6379"     # External: 6479 (6379 is taken by other project)
    volumes:
      - sx_redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - sentinelx-net
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: sx-clickhouse
    ports:
      - "9123:8123"     # HTTP API: 9123 (was 8123)
      - "9900:9000"     # TCP:      9900 (was 9000)
    environment:
      - CLICKHOUSE_DB=sentinelx
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - sx_clickhouse_data:/var/lib/clickhouse
      - ./database/clickhouse/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - sentinelx-net
    logging: *default-logging
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # ============================================================
  # Backend Microservices
  # NOTE: container_name removed from scaled services (replicas)
  # ============================================================
  api-gateway:
    <<: *backend-base
    container_name: sx-api-gateway
    build:
      context: ./backend
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "9100:8000"     # External: 9100 (was 8000)
    environment:
      - SERVICE_NAME=api-gateway

  auth-service:
    <<: *backend-base
    container_name: sx-auth-service
    build:
      context: ./backend
      dockerfile: services/auth-service/Dockerfile
    ports:
      - "9102:8002"     # External: 9102 (was 8002)
    environment:
      - SERVICE_NAME=auth-service

  ingestion-service:
    <<: *backend-base
    # No container_name — allows replicas to scale
    build:
      context: ./backend
      dockerfile: services/ingestion-service/Dockerfile
    ports:
      - "9101:8001"     # External: 9101 (was 8001)
    environment:
      - SERVICE_NAME=ingestion-service

  parser-service:
    <<: *backend-base
    # No container_name — allows replicas to scale
    build:
      context: ./backend
      dockerfile: services/parser-service/Dockerfile
    environment:
      - SERVICE_NAME=parser-service

  detection-service:
    <<: *backend-base
    # No container_name — allows replicas to scale
    build:
      context: ./backend
      dockerfile: services/detection-service/Dockerfile
    environment:
      - SERVICE_NAME=detection-service

  alert-service:
    <<: *backend-base
    container_name: sx-alerts
    build:
      context: ./backend
      dockerfile: services/alert-service/Dockerfile
    ports:
      - "9104:8004"     # External: 9104 (was 8004)
    environment:
      - SERVICE_NAME=alert-service

  search-service:
    <<: *backend-base
    container_name: sx-search
    build:
      context: ./backend
      dockerfile: services/search-service/Dockerfile
    ports:
      - "9105:8005"     # External: 9105 (was 8005)
    environment:
      - SERVICE_NAME=search-service

  websocket-gateway:
    <<: *backend-base
    container_name: sx-websocket
    build:
      context: ./backend
      dockerfile: services/websocket-gateway/Dockerfile
    ports:
      - "9106:8006"     # External: 9106 (was 8006)
    environment:
      - SERVICE_NAME=websocket-gateway

  ai-service:
    <<: *backend-base
    container_name: sx-ai
    build:
      context: ./backend
      dockerfile: services/ai-service/Dockerfile
    ports:
      - "9107:8007"     # External: 9107 (was 8007)
    environment:
      - SERVICE_NAME=ai-service

  celery-worker:
    <<: *backend-base
    container_name: sx-celery
    build:
      context: ./backend
      dockerfile: services/alert-service/Dockerfile
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=4
    environment:
      - SERVICE_NAME=celery-worker

  # ============================================================
  # Frontend
  # ============================================================
  frontend:
    container_name: sx-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3010:3000"     # External: 3010 (3000 & 3001 taken by other projects)
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:9100
      - NEXT_PUBLIC_WS_URL=ws://localhost:9106
    depends_on:
      - api-gateway
    networks:
      - sentinelx-net
    logging: *default-logging

  # ============================================================
  # Observability
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: sx-prometheus
    ports:
      - "9190:9090"     # External: 9190 (was 9090)
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - sx_prometheus_data:/prometheus
    networks:
      - sentinelx-net
    logging: *default-logging

  grafana:
    image: grafana/grafana:10.2.0
    container_name: sx-grafana
    ports:
      - "3011:3000"     # External: 3011 (3000/3001 taken)
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=sentinelx
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - sx_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - sentinelx-net
    logging: *default-logging

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: sx-kafka-ui
    ports:
      - "9180:8080"     # External: 9180 (was 8080)
    environment:
      - KAFKA_CLUSTERS_0_NAME=sentinelx
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      - kafka
    networks:
      - sentinelx-net
    logging: *default-logging

volumes:
  sx_zookeeper_data:
  sx_kafka_data:
  sx_redis_data:
  sx_clickhouse_data:
  sx_prometheus_data:
  sx_grafana_data:

networks:
  sentinelx-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16   # Changed from 172.20 to avoid potential overlap
